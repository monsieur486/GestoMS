<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" data-bs-theme="dark" lang="fr">
<head th:replace="~{layout :: head('Resources')}"></head>
<body>
<div th:replace="~{layout :: header}"></div>
<main class="container py-5">

  <h1 class="fw-bold mb-4">Resources</h1>

  <div th:if="${resources.isEmpty()}" class="text-muted">Aucune resource accessible.</div>

  <div class="row g-3">
    <div th:each="r : ${resources}" class="col-sm-6 col-lg-4">
      <a th:href="@{/resources/{s}(s=${r.serviceName})}"
         class="card feature-card text-decoration-none h-100">
        <div class="card-body d-flex align-items-center gap-3">
          <div class="feature-icon mb-0">📦</div>
          <span class="fw-semibold" th:text="${r.label}">label</span>
        </div>
      </a>
    </div>
  </div>

</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
