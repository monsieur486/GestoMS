<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" data-bs-theme="dark" lang="fr">
<head th:replace="~{layout :: head('Modifier — ' + ${entry.label})}"></head>
<body>
<div th:replace="~{layout :: header}"></div>
<main class="container py-5">

  <nav aria-label="breadcrumb" class="mb-4">
    <ol class="breadcrumb">
      <li class="breadcrumb-item"><a th:href="@{/resources}">Resources</a></li>
      <li class="breadcrumb-item">
        <a th:href="@{/resources/{s}(s=${entry.serviceName})}" th:text="${entry.label}">Resource</a>
      </li>
      <li class="breadcrumb-item active">Modifier</li>
    </ol>
  </nav>

  <div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">
      <div class="card shadow border-0">
        <div class="card-header fw-semibold" th:text="'Modifier — ' + ${entry.label}">Modifier</div>
        <div class="card-body p-4">
          <div th:if="${param.error}" class="alert alert-danger mb-3">Échec de la modification.</div>
          <form th:if="${row}" th:action="@{/resources/{s}/{id}/edit(s=${entry.serviceName},id=${rowId})}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <div class="mb-3">
              <label class="form-label">Name</label>
              <input class="form-control" type="text" name="name" th:value="${row.name}" required/>
            </div>
            <div class="mb-4">
              <label class="form-label">Description</label>
              <input class="form-control" type="text" name="description" th:value="${row.description}" required/>
            </div>
            <div class="d-flex gap-2">
              <button type="submit" class="btn btn-primary">Enregistrer</button>
              <a th:href="@{/resources/{s}(s=${entry.serviceName})}" class="btn btn-outline-secondary">Annuler</a>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>

</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
