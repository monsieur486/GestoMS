<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" data-bs-theme="dark" lang="fr">
<head th:replace="~{layout :: head(${entry.label})}"></head>
<body>
<div th:replace="~{layout :: header}"></div>
<main class="container py-5">

  <nav aria-label="breadcrumb" class="mb-4">
    <ol class="breadcrumb">
      <li class="breadcrumb-item"><a th:href="@{/resources}">Resources</a></li>
      <li class="breadcrumb-item active" th:text="${entry.label}">Resource</li>
    </ol>
  </nav>

  <h1 class="fw-bold mb-4" th:text="${entry.label}">Resource</h1>

  <div th:if="${param.error}" class="alert alert-danger mb-3">Échec de la création.</div>
  <div th:if="${error}" class="alert alert-danger mb-3" th:text="${error}">erreur</div>

  <div class="table-responsive mb-5" th:if="${rows}">
    <table class="table table-striped table-hover align-middle">
      <thead>
        <tr>
          <th>id</th>
          <th>name</th>
          <th>description</th>
          <th>actions</th>
        </tr>
      </thead>
      <tbody>
        <tr th:each="row : ${rows}">
          <td class="text-muted small" th:text="${row.id}">1</td>
          <td th:text="${row.name}">name</td>
          <td class="text-muted" th:text="${row.description}">desc</td>
          <td>
            <div class="d-flex gap-2">
              <a th:href="@{/resources/{s}/{id}/edit(s=${entry.serviceName},id=${row.id})}"
                 class="btn btn-sm btn-outline-primary">Modifier</a>
              <form th:action="@{/resources/{s}/{id}/delete(s=${entry.serviceName},id=${row.id})}" method="post"
                    onsubmit="return confirm('Supprimer cet élément ?');">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <button type="submit" class="btn btn-sm btn-outline-danger">Supprimer</button>
              </form>
            </div>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

  <div class="card border-0 shadow-sm">
    <div class="card-header fw-semibold">Ajouter un élément</div>
    <div class="card-body p-4">
      <form th:action="@{/resources/{s}(s=${entry.serviceName})}" method="post" class="row g-3 align-items-end">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
        <div class="col-sm-5">
          <label class="form-label">Name</label>
          <input class="form-control" type="text" name="name" required/>
        </div>
        <div class="col-sm-5">
          <label class="form-label">Description</label>
          <input class="form-control" type="text" name="description" required/>
        </div>
        <div class="col-sm-2">
          <button type="submit" class="btn btn-primary w-100">Créer</button>
        </div>
      </form>
    </div>
  </div>

</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
