<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" data-bs-theme="dark" lang="fr">
<head th:replace="~{layout :: head('Chat')}"></head>
<body>
<div th:replace="~{layout :: header}"></div>
<main class="container py-5">

  <h1 class="fw-bold mb-3">Chat</h1>

  <div class="d-flex align-items-center gap-2 mb-3">
    <span class="status-dot disconnected" id="statusDot"></span>
    <span id="statusText" class="text-muted small">Connexion…</span>
  </div>

  <div class="chat-messages mb-3" id="messages">
    <div th:each="m : ${history}" class="chat-message">
      <span class="sender" th:text="${m.user}">user</span>
      <span class="text ms-1" th:text="${m.text}">text</span>
    </div>
  </div>

  <form id="chat-form" class="d-flex gap-2">
    <input class="form-control" type="text" id="chat-text"
           placeholder="Votre message…" autocomplete="off" required/>
    <button type="submit" class="btn btn-primary px-4">Envoyer</button>
  </form>

</main>
<script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@stomp/stompjs@7/bundles/stomp.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
  const messages = document.getElementById('messages');
  const dot = document.getElementById('statusDot');
  const statusText = document.getElementById('statusText');
  const form = document.getElementById('chat-form');
  const input = document.getElementById('chat-text');

  const client = new StompJs.Client({
    webSocketFactory: () => new SockJS('/ws'),
    reconnectDelay: 2000,
    onConnect: () => {
      dot.className = 'status-dot connected';
      statusText.textContent = 'Connecté';
      client.subscribe('/topic/chat', message => {
        const m = JSON.parse(message.body);
        const div = document.createElement('div');
        div.className = 'chat-message';
        div.innerHTML = `<span class="sender">${m.user}</span><span class="text ms-1">${m.text}</span>`;
        messages.appendChild(div);
        messages.scrollTop = messages.scrollHeight;
      });
    },
    onWebSocketClose: () => {
      dot.className = 'status-dot disconnected';
      statusText.textContent = 'Déconnecté — reconnexion…';
    }
  });
  client.activate();

  form.addEventListener('submit', e => {
    e.preventDefault();
    const text = input.value.trim();
    if (!text) return;
    client.publish({ destination: '/app/chat.send', body: JSON.stringify({ text }) });
    input.value = '';
  });
</script>
</body>
</html>
