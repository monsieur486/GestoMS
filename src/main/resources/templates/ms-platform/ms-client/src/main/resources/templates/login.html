<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" data-bs-theme="dark" lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Connexion — ms-platform</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
  <link rel="stylesheet" th:href="@{/css/app.css}"/>
</head>
<body>
<div class="auth-page">
  <div class="auth-card">
    <div class="card shadow-lg border-0">

      <div class="card-header">
        <div class="brand-title">ms-platform</div>
        <div class="text-white-50 small mt-1">Accès sécurisé</div>
      </div>

      <div class="card-body p-4">
        <div th:if="${param.logout}" class="alert alert-success py-2 small mb-3">
          Vous êtes déconnecté.
        </div>
        <div th:if="${param.expired}" class="alert alert-warning py-2 small mb-3">
          Session expirée, reconnectez-vous.
        </div>
        <div th:if="${error}" class="alert alert-danger py-2 small mb-3" th:text="${error}">erreur</div>

        <form th:action="@{/login}" method="post">
          <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
          <div class="mb-3">
            <label class="form-label">Utilisateur</label>
            <input class="form-control" type="text" name="username" required autofocus/>
          </div>
          <div class="mb-4">
            <label class="form-label">Mot de passe</label>
            <input class="form-control" type="password" name="password" required/>
          </div>
          <button type="submit" class="btn btn-primary w-100 py-2">Se connecter</button>
        </form>
      </div>

      <div class="card-footer text-center py-3">
        <a th:href="@{/public}" class="text-muted small text-decoration-none">← Retour à l'accueil</a>
      </div>
    </div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
