server:
  port: ${SERVICE_B_PORT:8080}
spring:
  application:
    name: service-b
  data:
    mongodb:
      uri: ${SERVICE_B_MONGO_URI:mongodb://service_b:service_b@localhost:27017/service_b_db?authSource=admin}
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8089/realms/ms-realm}
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://keycloak:8080/realms/ms-realm/protocol/openid-connect/certs}
mongock:
  migration-scan-package:
    - com.mr486.msplatform.serviceb.dbchangelogs
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka/}
management:
  endpoints:
    web:
      exposure:
        include: health,info
