<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" data-bs-theme="dark" lang="fr">
<head th:replace="~{layout :: head('Éditer un utilisateur')}"></head>
<body>
<div th:replace="~{layout :: header}"></div>
<main class="container py-5">

  <nav aria-label="breadcrumb" class="mb-4">
    <ol class="breadcrumb">
      <li class="breadcrumb-item"><a th:href="@{/users}">Utilisateurs</a></li>
      <li class="breadcrumb-item active" th:text="${user?.username}">user</li>
    </ol>
  </nav>

  <div th:if="${param.updated}" class="alert alert-success mb-3">Utilisateur mis à jour.</div>
  <div th:if="${param.pwd}" class="alert alert-success mb-3">Mot de passe réinitialisé.</div>
  <div th:if="${error}" class="alert alert-danger mb-3" th:text="${error}">erreur</div>
  <div th:if="${param.error}" class="alert alert-danger mb-3">Keycloak indisponible.</div>

  <div th:if="${user}" class="row g-4">

    <div class="col-lg-7">
      <div class="card shadow border-0">
        <div class="card-header fw-semibold">
          Éditer <span th:text="${user.username}">user</span>
        </div>
        <div class="card-body p-4">
          <form th:action="@{/users/{id}/edit(id=${user.id})}" method="post" class="row g-3">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <div class="col-12">
              <label class="form-label">Username</label>
              <input class="form-control" type="text" th:value="${user.username}" disabled/>
            </div>
            <div class="col-sm-6">
              <label class="form-label">Email</label>
              <input class="form-control" type="email" name="email" th:value="${user.email}"/>
            </div>
            <div class="col-sm-6">
              <label class="form-label">Prénom</label>
              <input class="form-control" type="text" name="firstName" th:value="${user.firstName}"/>
            </div>
            <div class="col-sm-6">
              <label class="form-label">Nom</label>
              <input class="form-control" type="text" name="lastName" th:value="${user.lastName}"/>
            </div>
            <div class="col-sm-6 d-flex align-items-end pb-1">
              <div th:if="${user.username == currentUsername}" class="form-check">
                <input class="form-check-input" type="checkbox" checked disabled/>
                <input type="hidden" name="enabled" value="true"/>
                <label class="form-check-label text-muted">Actif (votre propre compte)</label>
              </div>
              <div th:unless="${user.username == currentUsername}" class="form-check">
                <input class="form-check-input" type="checkbox" name="enabled" value="true"
                       th:checked="${user.enabled}"/>
                <label class="form-check-label">Actif</label>
              </div>
            </div>
            <div class="col-12">
              <button type="submit" class="btn btn-primary">Enregistrer</button>
              <a th:href="@{/users}" class="btn btn-outline-secondary ms-2">Annuler</a>
            </div>
          </form>
        </div>
      </div>
    </div>

    <div class="col-lg-5">
      <div class="card shadow border-0">
        <div class="card-header fw-semibold">Réinitialiser le mot de passe</div>
        <div class="card-body p-4">
          <form th:action="@{/users/{id}/password(id=${user.id})}" method="post" class="row g-3">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <div class="col-12">
              <label class="form-label">Nouveau mot de passe</label>
              <input class="form-control" type="password" name="password" required/>
            </div>
            <div class="col-12">
              <button type="submit" class="btn btn-outline-warning">Réinitialiser</button>
            </div>
          </form>
        </div>
      </div>
    </div>

  </div>

</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
