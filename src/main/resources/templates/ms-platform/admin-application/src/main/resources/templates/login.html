<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Connexion — admin-application</title>
  <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<main class="login">
  <h1>Connexion</h1>
  <p th:if="${param.logout}" class="info">Vous êtes déconnecté.</p>
  <p th:if="${param.expired}" class="error">Session expirée, reconnectez-vous.</p>
  <p th:if="${error}" class="error" th:text="${error}">erreur</p>
  <form th:action="@{/login}" method="post">
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
    <label>Utilisateur
      <input type="text" name="username" required autofocus/>
    </label>
    <label>Mot de passe
      <input type="password" name="password" required/>
    </label>
    <button type="submit">Se connecter</button>
  </form>
</main>
</body>
</html>
