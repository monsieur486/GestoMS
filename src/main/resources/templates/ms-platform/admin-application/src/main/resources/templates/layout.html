<!doctype html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      data-bs-theme="dark" lang="fr">

<head th:fragment="head(title)">
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title th:text="${title} + ' — admin-application'">admin-application</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
  <link rel="stylesheet" th:href="@{/css/app.css}"/>
</head>

<body>
<header th:fragment="header">
  <nav class="navbar navbar-expand-lg sticky-top">
    <div class="container-fluid px-4">

      <a class="navbar-brand" th:href="@{/}">admin-application</a>

      <button class="navbar-toggler border-secondary" type="button"
              data-bs-toggle="collapse" data-bs-target="#mainNav"
              aria-controls="mainNav" aria-expanded="false" aria-label="Menu">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="mainNav">
        <ul class="navbar-nav me-auto gap-1">
          <li class="nav-item"><a class="nav-link" th:href="@{/}">Accueil</a></li>
          <li class="nav-item"><a class="nav-link" th:href="@{/users}">Utilisateurs</a></li>
          <li class="nav-item"><a class="nav-link" th:href="@{/roles}">Rôles</a></li>
        </ul>

        <ul class="navbar-nav align-items-lg-center gap-2">
          <li class="nav-item">
            <span class="nav-link d-flex align-items-center gap-1 text-muted pe-none">
              <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" fill="currentColor" viewBox="0 0 16 16">
                <path d="M8 8a3 3 0 1 0 0-6 3 3 0 0 0 0 6zm2-3a2 2 0 1 1-4 0 2 2 0 0 1 4 0zm4 8c0 1-1 1-1 1H3s-1 0-1-1 1-4 6-4 6 3 6 4zm-1-.004c-.001-.246-.154-.986-.832-1.664C11.516 10.68 10.029 10 8 10c-2.03 0-3.516.68-4.168 1.332-.678.678-.83 1.418-.832 1.664h10z"/>
              </svg>
              <span sec:authentication="name">admin</span>
            </span>
          </li>
          <li class="nav-item">
            <form th:action="@{/logout}" method="post" class="m-0">
              <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
              <button type="submit" class="btn btn-sm btn-outline-danger">Déconnexion</button>
            </form>
          </li>
        </ul>
      </div>

    </div>
  </nav>
</header>
</body>
</html>
