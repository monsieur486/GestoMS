<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" data-bs-theme="dark" lang="fr">
<head th:replace="~{layout :: head('Rôles')}"></head>
<body>
<div th:replace="~{layout :: header}"></div>
<main class="container py-5">

  <nav aria-label="breadcrumb" class="mb-4">
    <ol class="breadcrumb">
      <li class="breadcrumb-item"><a th:href="@{/users}">Utilisateurs</a></li>
      <li class="breadcrumb-item active" th:text="${user?.username}">user</li>
    </ol>
  </nav>

  <div th:if="${error}" class="alert alert-danger mb-3" th:text="${error}">erreur</div>
  <div th:if="${param.error != null and param.error[0] == 'self'}" class="alert alert-warning mb-3">
    Vous ne pouvez pas modifier vos propres rôles.
  </div>
  <div th:if="${param.error != null and param.error[0] != 'self'}" class="alert alert-danger mb-3">
    Keycloak indisponible.
  </div>

  <div th:if="${user}">

    <h1 class="fw-bold mb-4">
      Rôles de <span class="text-primary" th:text="${user.username}">user</span>
    </h1>

    <div class="row g-4">

      <div class="col-md-6">
        <div class="card shadow border-0 h-100">
          <div class="card-header fw-semibold">Rôles actuels</div>
          <div class="card-body p-0">
            <ul class="list-group list-group-flush" th:if="${not #lists.isEmpty(userRoles)}">
              <li th:each="r : ${userRoles}"
                  class="list-group-item list-group-item-dark d-flex justify-content-between align-items-center py-3 px-4">
                <span class="role-badge" th:text="${r.name}"
                      th:classappend="${r.name.contains('ADMIN')} ? ' admin'">ROLE</span>
                <form th:unless="${user.username == currentUsername}"
                      th:action="@{/users/{id}/roles/remove(id=${userId})}" method="post" class="m-0">
                  <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                  <input type="hidden" name="roleName" th:value="${r.name}"/>
                  <button type="submit" class="btn btn-sm btn-outline-danger">Retirer</button>
                </form>
                <span th:if="${user.username == currentUsername}"
                      class="text-muted small">protégé</span>
              </li>
            </ul>
            <div th:if="${#lists.isEmpty(userRoles)}" class="p-4 text-muted small">
              Aucun rôle assigné.
            </div>
          </div>
        </div>
      </div>

      <div class="col-md-6">
        <div class="card shadow border-0 h-100">
          <div class="card-header fw-semibold">Assigner un rôle</div>
          <div class="card-body p-0">
            <ul class="list-group list-group-flush" th:if="${not #lists.isEmpty(assignableRoles)}">
              <li th:each="r : ${assignableRoles}"
                  class="list-group-item list-group-item-dark d-flex justify-content-between align-items-center py-3 px-4">
                <span class="role-badge" th:text="${r.name}"
                      th:classappend="${r.name.contains('ADMIN')} ? ' admin'">ROLE</span>
                <form th:unless="${user.username == currentUsername}"
                      th:action="@{/users/{id}/roles/add(id=${userId})}" method="post" class="m-0">
                  <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                  <input type="hidden" name="roleName" th:value="${r.name}"/>
                  <button type="submit" class="btn btn-sm btn-outline-primary">Assigner</button>
                </form>
                <span th:if="${user.username == currentUsername}"
                      class="text-muted small">protégé</span>
              </li>
            </ul>
            <div th:if="${#lists.isEmpty(assignableRoles)}" class="p-4 text-muted small">
              Tous les rôles sont déjà assignés.
            </div>
          </div>
        </div>
      </div>

    </div>
  </div>

</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
