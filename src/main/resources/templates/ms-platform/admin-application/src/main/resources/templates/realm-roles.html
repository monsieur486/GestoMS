<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" data-bs-theme="dark" lang="fr">
<head th:replace="~{layout :: head('Rôles du realm')}"></head>
<body>
<div th:replace="~{layout :: header}"></div>
<main class="container py-5">

  <h1 class="fw-bold mb-4">Rôles du realm</h1>

  <div th:if="${error}" class="alert alert-danger mb-3" th:text="${error}">erreur</div>
  <div th:if="${param.error != null and param.error[0] == 'conflict'}" class="alert alert-warning mb-3">
    Ce nom de rôle existe déjà.
  </div>
  <div th:if="${param.error != null and param.error[0] == 'protected'}" class="alert alert-warning mb-3">
    Le rôle <strong>ROLE_ADMIN</strong> est protégé et ne peut pas être supprimé.
  </div>
  <div th:if="${param.error != null and param.error[0] == 'blank'}" class="alert alert-warning mb-3">
    Le nom du rôle ne peut pas être vide.
  </div>
  <div th:if="${param.error != null
               and param.error[0] != 'conflict'
               and param.error[0] != 'protected'
               and param.error[0] != 'blank'}" class="alert alert-danger mb-3">
    Keycloak indisponible.
  </div>
  <div th:if="${param.created}" class="alert alert-success mb-3">Rôle créé avec succès.</div>
  <div th:if="${param.deleted}" class="alert alert-success mb-3">Rôle supprimé.</div>

  <div class="table-responsive mb-5" th:if="${roles != null}">
    <table class="table table-striped table-hover align-middle">
      <thead>
        <tr>
          <th>nom</th>
          <th>description</th>
          <th>actions</th>
        </tr>
      </thead>
      <tbody>
        <tr th:each="r : ${roles}">
          <td>
            <span class="role-badge" th:text="${r.name}"
                  th:classappend="${r.name.contains('ADMIN')} ? ' admin'">ROLE</span>
          </td>
          <td class="text-muted small" th:text="${r.description}"></td>
          <td>
            <form th:unless="${r.name == 'ROLE_ADMIN'}"
                  th:action="@{/roles/{n}/delete(n=${r.name})}" method="post"
                  onsubmit="return confirm('Supprimer le rôle ' + this.dataset.role + ' ?');"
                  th:attr="data-role=${r.name}">
              <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
              <button type="submit" class="btn btn-sm btn-outline-danger">Supprimer</button>
            </form>
            <span th:if="${r.name == 'ROLE_ADMIN'}" class="text-muted small">protégé</span>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

  <div class="card shadow border-0">
    <div class="card-header fw-semibold">Créer un rôle</div>
    <div class="card-body p-4">
      <form th:action="@{/roles}" method="post" class="row g-3">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
        <div class="col-sm-5">
          <label class="form-label">Nom du rôle *</label>
          <input class="form-control" type="text" name="name" placeholder="ex : ROLE_MANAGER" required/>
        </div>
        <div class="col-sm-5">
          <label class="form-label">Description</label>
          <input class="form-control" type="text" name="description" placeholder="Optionnel"/>
        </div>
        <div class="col-sm-2 d-flex align-items-end">
          <button type="submit" class="btn btn-primary w-100">Créer</button>
        </div>
      </form>
    </div>
  </div>

</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
