<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" data-bs-theme="dark" lang="fr">
<head th:replace="~{layout :: head('Administration')}"></head>
<body>
<div th:replace="~{layout :: header}"></div>
<main class="container py-5">

  <div class="mb-5">
    <h1 class="fw-bold mb-2">
      Administration&nbsp;<span class="text-primary" th:text="${username}">admin</span>
    </h1>
    <div class="d-flex flex-wrap gap-2">
      <span th:each="role : ${roles}"
            th:text="${role}"
            th:classappend="${role.contains('ADMIN')} ? ' admin'"
            class="role-badge">ROLE</span>
    </div>
  </div>

  <div class="row g-4">
    <div class="col-sm-6 col-lg-4">
      <div class="card feature-card h-100" onclick="location.href=this.querySelector('a').href">
        <div class="card-body d-flex flex-column">
          <div class="feature-icon">👥</div>
          <h5 class="card-title fw-semibold">Utilisateurs</h5>
          <p class="card-text text-muted small flex-grow-1">
            Créez, éditez et gérez les comptes utilisateurs et leurs rôles.
          </p>
          <a th:href="@{/users}" class="btn btn-primary btn-sm mt-3">Gérer →</a>
        </div>
      </div>
    </div>
  </div>

</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
