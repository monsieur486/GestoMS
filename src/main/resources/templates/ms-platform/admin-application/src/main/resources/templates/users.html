<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Utilisateurs — admin-application</title>
  <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<div th:replace="~{layout :: header}"></div>
<main>
  <p><a th:href="@{/}">← Accueil</a></p>
  <h1>Utilisateurs</h1>
  <p th:if="${error}" class="error" th:text="${error}">erreur</p>
  <p th:if="${param.error != null and param.error[0] == 'conflict'}" class="error">Nom d'utilisateur déjà pris.</p>
  <p th:if="${param.error != null and param.error[0] == 'self'}" class="error">Vous ne pouvez pas supprimer votre propre compte.</p>
  <p th:if="${param.error != null and param.error[0] != 'conflict' and param.error[0] != 'self'}" class="error">Keycloak indisponible.</p>
  <form th:action="@{/users}" method="get">
    <input type="text" name="search" th:value="${search}" placeholder="Rechercher…"/>
    <button type="submit">Rechercher</button>
  </form>
  <table th:if="${users}">
    <thead><tr><th>username</th><th>email</th><th>prénom</th><th>nom</th><th>actif</th><th>actions</th></tr></thead>
    <tbody>
      <tr th:each="u : ${users}">
        <td th:text="${u.username}">user</td>
        <td th:text="${u.email}">email</td>
        <td th:text="${u.firstName}">first</td>
        <td th:text="${u.lastName}">last</td>
        <td th:text="${u.enabled}">true</td>
        <td>
          <a th:href="@{/users/{id}/edit(id=${u.id})}">éditer</a>
          <a th:href="@{/users/{id}/roles(id=${u.id})}">rôles</a>
          <form th:if="${u.username != currentUsername}" th:action="@{/users/{id}/delete(id=${u.id})}" method="post"
                onsubmit="return confirm('Supprimer cet utilisateur ?');">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <button type="submit">Supprimer</button>
          </form>
        </td>
      </tr>
    </tbody>
  </table>
  <p th:if="${users}" class="pager">
    <a th:if="${hasPrev}" th:href="@{/users(search=${search}, page=${page - 1})}">← Précédent</a>
    <span>Page <span th:text="${page + 1}">1</span> / <span th:text="${totalPages}">1</span></span>
    <a th:if="${hasNext}" th:href="@{/users(search=${search}, page=${page + 1})}">Suivant →</a>
  </p>
  <h2>Créer un utilisateur</h2>
  <form th:action="@{/users}" method="post">
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
    <label>Username <input type="text" name="username" required/></label>
    <label>Email <input type="email" name="email"/></label>
    <label>Prénom <input type="text" name="firstName"/></label>
    <label>Nom <input type="text" name="lastName"/></label>
    <label>Mot de passe <input type="password" name="password" required/></label>
    <button type="submit">Créer</button>
  </form>
</main>
</body>
</html>
